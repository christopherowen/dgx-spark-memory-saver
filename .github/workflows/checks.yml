name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Provenance, documentation and syntax (no hardware access)
        run: ./scripts/check
