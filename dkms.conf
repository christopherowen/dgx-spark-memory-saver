PACKAGE_NAME="dgx-spark-memory-saver"
PACKAGE_VERSION="0.4.0"
BUILT_MODULE_NAME[0]="nvidia-uvm"
BUILT_MODULE_LOCATION[0]=".work/uvm"
DEST_MODULE_LOCATION[0]="/kernel/drivers/video"
MAKE[0]="./scripts/driver-build build-dkms --kernel '${kernelver}' --headers '${kernel_source_dir}'"
CLEAN="./scripts/driver-build clean"
PRE_INSTALL="scripts/driver-build check-install --kernel ${kernelver} --headers ${kernel_source_dir} --dkms-module-dir ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/${kernelver}/${arch}/module"
POST_INSTALL="scripts/refresh-initramfs ${kernelver}"
POST_REMOVE="scripts/refresh-initramfs ${kernelver}"
AUTOINSTALL="yes"
BUILD_EXCLUSIVE_ARCH="^aarch64$"
memory_saver_compat="$(dirname "${BASH_SOURCE[0]}")/compatibility.json"
BUILD_EXCLUSIVE_KERNEL="$(python3 -c 'import json,re,sys; print("^(" + "|".join(re.escape(k) for k in json.load(open(sys.argv[1]))["kernels"]) + ")$")' "$memory_saver_compat")"
BUILD_EXCLUSIVE_CONFIG="CONFIG_ARM64_64K_PAGES"
NO_WEAK_MODULES="yes"
